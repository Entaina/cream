name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        # See the note in the `test` job: bound apt with a timeout + retry so a
        # stuck hosted-runner mirror fails fast instead of hanging the job.
        run: |
          for i in 1 2 3; do
            if sudo timeout -k 30 240 apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
               && sudo timeout -k 30 240 apt-get install --no-install-recommends -y \
                    -o Acquire::Retries=3 -o Acquire::http::Timeout=30 libvips; then
              exit 0
            fi
            echo "::warning::apt attempt $i failed or timed out; retrying in 15s"
            sleep 15
          done
          echo "::error::apt install failed after 3 attempts"; exit 1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        # Hosted-runner apt mirrors/dpkg locks occasionally hang indefinitely,
        # stalling the whole job. Bound each apt call with a timeout and retry so
        # a stuck mirror fails fast and hits another one instead of hanging.
        run: |
          for i in 1 2 3; do
            if sudo timeout -k 30 240 apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
               && sudo timeout -k 30 240 apt-get install --no-install-recommends -y \
                    -o Acquire::Retries=3 -o Acquire::http::Timeout=30 libpq-dev libvips; then
              exit 0
            fi
            echo "::warning::apt attempt $i failed or timed out; retrying in 15s"
            sleep 15
          done
          echo "::error::apt install failed after 3 attempts"; exit 1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build Tailwind CSS
        env:
          RAILS_ENV: test
        run: bin/rails tailwindcss:build

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare && bundle exec rspec
