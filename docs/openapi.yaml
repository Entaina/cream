openapi: 3.1.0
info:
  title: Cream CRM API
  version: 1.0.0
  description: |
    REST API for the Cream CRM workspace data model.

    Authentication uses a Bearer token in the `Authorization` header:

    - **API token** — created in the Cream web app (`Settings → API tokens`). Prefix: `cream_`.
    - **OAuth access token** — obtained via Doorkeeper with scope `api` (same flow as MCP, different scope).

    Workspace context:

    - API tokens are bound to one workspace.
    - OAuth tokens may access any workspace the user belongs to; pass `X-Cream-Workspace-Id` to select one, or the user's default workspace is used.

    JSON request bodies use the `application/json` content type unless noted otherwise.

servers:
  - url: /
    description: Current host

tags:
  - name: People
  - name: Companies
  - name: Pipelines
  - name: Products
  - name: Deals
  - name: Deal notes
  - name: Deal emails
  - name: Tasks
  - name: Gmail add-on
  - name: Marketing

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API token (`cream_…`) or OAuth access token (Doorkeeper scope `api`).

  parameters:
    WorkspaceId:
      name: X-Cream-Workspace-Id
      in: header
      required: false
      schema:
        type: integer
      description: Target workspace when using an OAuth access token. Ignored for API tokens (workspace is fixed on the token).

    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
      description: Case-insensitive search term (supported on list endpoints).

    ProductSegmentQuery:
      name: segment
      in: query
      required: false
      schema:
        type: string
        enum: [b2b, b2c]
      description: Filter products by segment.

    PersonEmailQuery:
      name: email
      in: query
      required: false
      schema:
        type: string
        format: email
      description: Exact email match (case-insensitive) against primary or any secondary person email.

    PersonId:
      name: id
      in: path
      required: true
      schema:
        type: integer

    CompanyId:
      name: id
      in: path
      required: true
      schema:
        type: integer

    PipelineId:
      name: id
      in: path
      required: true
      schema:
        type: integer

    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: integer

    DealId:
      name: id
      in: path
      required: true
      schema:
        type: integer

    DealIdNested:
      name: deal_id
      in: path
      required: true
      schema:
        type: integer

    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Missing or invalid Bearer token.
    Forbidden:
      description: Token valid but not allowed for the requested workspace or resource.
    NotFound:
      description: Record not found in the current workspace, or feature disabled.
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    FeatureDisabled:
      description: Feature not enabled for this deployment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FeatureDisabledError"

  schemas:
    ValidationError:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: string

    FeatureDisabledError:
      type: object
      properties:
        error:
          type: string

    Timestamps:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PersonEmail:
      type: object
      properties:
        address:
          type: string
          format: email
        primary:
          type: boolean

    Person:
      allOf:
        - type: object
          required: [id, first_name, last_name]
          properties:
            id:
              type: integer
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
              format: email
              nullable: true
            emails:
              type: array
              items:
                $ref: "#/components/schemas/PersonEmail"
            company_id:
              type: integer
              nullable: true
            company:
              type: string
              nullable: true
              description: Company name (read-only).
        - $ref: "#/components/schemas/Timestamps"

    PersonInput:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        job_title:
          type: string
        location:
          type: string
        company_id:
          type: integer
        person_emails_attributes:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              address:
                type: string
                format: email
              primary:
                type: boolean
              _destroy:
                type: boolean

    Company:
      allOf:
        - type: object
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string
            domain:
              type: string
              nullable: true
            industry:
              type: string
              nullable: true
        - $ref: "#/components/schemas/Timestamps"

    CompanyInput:
      type: object
      properties:
        name:
          type: string
        domain:
          type: string
        industry:
          type: string
        employee_range:
          type: string
        location:
          type: string
        annual_revenue:
          type: number

    PipelineStage:
      type: object
      required: [id, name, position, probability, won, closed, color]
      properties:
        id:
          type: integer
        name:
          type: string
        position:
          type: integer
        probability:
          type: integer
          minimum: 0
          maximum: 100
        won:
          type: boolean
        closed:
          type: boolean
        color:
          type: string

    Pipeline:
      allOf:
        - type: object
          required: [id, name, default, position, stages]
          properties:
            id:
              type: integer
            name:
              type: string
            default:
              type: boolean
              description: Whether this is the workspace default pipeline for new deals.
            position:
              type: integer
            stages:
              type: array
              items:
                $ref: "#/components/schemas/PipelineStage"
        - $ref: "#/components/schemas/Timestamps"

    Edition:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        starts_on:
          type: string
          format: date
          nullable: true
        ends_on:
          type: string
          format: date
          nullable: true

    Product:
      allOf:
        - type: object
          required: [id, name, price, editions]
          properties:
            id:
              type: integer
            name:
              type: string
            price:
              type: number
            description:
              type: string
              nullable: true
            segment:
              type: string
              enum: [b2b, b2c]
              nullable: true
            editions:
              type: array
              items:
                $ref: "#/components/schemas/Edition"
        - $ref: "#/components/schemas/Timestamps"

    DealTaskInput:
      type: object
      required: [title, due_on]
      properties:
        title:
          type: string
          description: Next action title.
        due_on:
          type: string
          format: date
          description: Due date (today or later). Required when creating a deal.

    DealProductLine:
      type: object
      required: [id, product_id, product_name, quantity, unit_price, subtotal]
      properties:
        id:
          type: integer
        product_id:
          type: integer
        product_name:
          type: string
        edition_id:
          type: integer
          nullable: true
        edition_name:
          type: string
          nullable: true
        quantity:
          type: integer
        unit_price:
          type: number
        subtotal:
          type: number

    DealProductInput:
      type: object
      properties:
        id:
          type: integer
          description: Line item id. Required when updating or removing an existing line.
        product_id:
          type: integer
          description: Required when adding a new line.
        edition_id:
          type: integer
          description: Edition id (must belong to the product). Alternative to edition_name.
        edition_name:
          type: string
          description: Edition name; created on the product if it does not exist yet. Pass an empty string to clear the edition on update.
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: number
          description: Optional override; defaults to the catalogue price when creating a line.
        _destroy:
          type: boolean
          description: Set to true to remove an existing line (requires id).

    Note:
      allOf:
        - type: object
          required: [id, body]
          properties:
            id:
              type: integer
            title:
              type: string
              nullable: true
            body:
              type: string
        - $ref: "#/components/schemas/Timestamps"

    NoteInput:
      type: object
      required: [body]
      properties:
        title:
          type: string
        body:
          type: string

    Deal:
      allOf:
        - type: object
          required: [id, name, stage, value, currency, company_id]
          properties:
            id:
              type: integer
            name:
              type: string
            stage:
              type: string
              description: Current pipeline stage label.
            value:
              type: number
            currency:
              type: string
            execution_duration_days:
              type: integer
              nullable: true
              minimum: 1
              description: Optional execution duration in days.
            company_id:
              type: integer
            contact_ids:
              type: array
              items:
                type: integer
              description: Person IDs linked to the deal as contacts.
            deal_products:
              type: array
              items:
                $ref: "#/components/schemas/DealProductLine"
            notes:
              type: array
              description: Present only in create responses when notes were sent in the request.
              items:
                $ref: "#/components/schemas/Note"
            email:
              $ref: "#/components/schemas/DealEmail"
              description: Present only in create responses when an email was sent in the request.
        - $ref: "#/components/schemas/Timestamps"

    DealInput:
      type: object
      required: [name, company_id]
      properties:
        name:
          type: string
        company_id:
          type: integer
        pipeline_id:
          type: integer
        pipeline_stage_id:
          type: integer
          description: On update, stage changes run through the stage machine (activities, automations, triggers).
        value:
          type: number
        currency:
          type: string
        probability:
          type: integer
          minimum: 0
          maximum: 100
        expected_close_date:
          type: string
          format: date
        execution_duration_days:
          type: integer
          minimum: 1
          nullable: true
          description: Optional execution duration in days.
        contact_ids:
          type: array
          items:
            type: integer
          description: Person IDs to link as deal contacts. Each person must belong to the deal company (or partner, if set).
        deal_products_attributes:
          type: array
          description: Product line items on the deal. Deal value is recalculated from line subtotals.
          items:
            $ref: "#/components/schemas/DealProductInput"
        tasks_attributes:
          type: array
          description: At least one task with a future due date is required when creating a deal.
          items:
            $ref: "#/components/schemas/DealTaskInput"

    DealCreateRequest:
      type: object
      required: [deal]
      properties:
        deal:
          $ref: "#/components/schemas/DealInput"
        notes:
          type: array
          description: Optional notes created atomically with the deal (rolled back if any note is invalid).
          items:
            $ref: "#/components/schemas/NoteInput"
        email:
          $ref: "#/components/schemas/DealEmailInput"
          description: >-
            Optional outbound email queued atomically with the deal (rolled back if the
            email or any attachment is invalid). Requires the `record_email` feature.
            Attachments use the same Base64 format as POST /deals/{deal_id}/emails,
            or upload binary files via multipart/form-data.

    DealCreateMultipartRequest:
      type: object
      required: [deal]
      description: >-
        Multipart variant of deal creation. Use nested field names such as
        `deal[name]`, `deal[company_id]`, `deal[tasks_attributes][0][title]`,
        `email[subject]`, `email[body]` and upload files as `email[attachments][]`.
      properties:
        deal:
          $ref: "#/components/schemas/DealInput"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteInput"
        email:
          $ref: "#/components/schemas/DealEmailInput"

    DealEmailMultipartRequest:
      type: object
      required: [email]
      description: >-
        Multipart variant of deal email creation. Send `email[to_address]`,
        `email[subject]`, `email[body]` and upload files as `email[attachments][]`.
      properties:
        email:
          $ref: "#/components/schemas/DealEmailInput"

    DealEmail:
      type: object
      required: [id, to_address, subject, status, via_gmail]
      properties:
        id:
          type: integer
        to_address:
          type: string
          format: email
        subject:
          type: string
        status:
          type: string
          enum: [sent, scheduled, failed, opened, received]
        via_gmail:
          type: boolean
          description: True when delivery is queued through the sender's connected Gmail account.
        attachments:
          type: array
          description: Filenames of the files attached to the message.
          items:
            type: string

    DealEmailInput:
      type: object
      required: [subject, body]
      properties:
        to_address:
          type: string
          format: email
          description: Defaults to the first contact's email on the deal when omitted.
        subject:
          type: string
        body:
          type: string
        attachments:
          type: array
          description: >-
            Files to attach to the email. With `application/json`, send Base64
            objects in this array. With `multipart/form-data`, upload binary files
            as `email[attachments][]`. Limits: up to 10 files, 10 MB per file and
            25 MB in total.
          items:
            oneOf:
              - $ref: "#/components/schemas/DealEmailAttachmentInput"
              - type: string
                format: binary
                description: Uploaded file when using multipart/form-data.

    DealEmailAttachmentInput:
      type: object
      required: [filename, content]
      properties:
        filename:
          type: string
          example: informe.pdf
        content_type:
          type: string
          description: Optional; inferred from the filename when omitted.
          example: application/pdf
        content:
          type: string
          format: byte
          description: Base64-encoded file content.

    Task:
      allOf:
        - type: object
          required: [id, title, completed]
          properties:
            id:
              type: integer
            title:
              type: string
            due_on:
              type: string
              format: date
              nullable: true
            completed:
              type: boolean
            completed_at:
              type: string
              format: date-time
              nullable: true
            assignee_id:
              type: integer
              nullable: true
            taskable_type:
              type: string
              enum: [Company, Person, Deal]
              nullable: true
            taskable_id:
              type: integer
              nullable: true
        - $ref: "#/components/schemas/Timestamps"

    TaskInput:
      type: object
      properties:
        title:
          type: string
        due_on:
          type: string
          format: date
        assignee_id:
          type: integer
        taskable_type:
          type: string
          enum: [Company, Person, Deal]
        taskable_id:
          type: integer
        completed:
          type: boolean

    NextTaskInput:
      type: object
      required: [title, due_on]
      properties:
        title:
          type: string
        due_on:
          type: string
          format: date
          description: Due date (today or later).

    CompleteAndReplaceTaskResponse:
      type: object
      required: [completed_task, next_task]
      properties:
        completed_task:
          $ref: "#/components/schemas/Task"
        next_task:
          $ref: "#/components/schemas/Task"

    GmailContext:
      type: object
      required: [selected_workspace_id, workspaces]
      properties:
        selected_workspace_id:
          type: integer
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/GmailWorkspace"

    GmailWorkspace:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        default_pipeline_id:
          type: integer
          nullable: true
        pipelines:
          type: array
          items:
            $ref: "#/components/schemas/GmailPipeline"

    GmailPipeline:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        default:
          type: boolean
        stages:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              closed:
                type: boolean

    GmailThreadStatusRequest:
      type: object
      properties:
        gmail_thread_id:
          type: string
        rfc822_message_ids:
          type: array
          items:
            type: string
        participant_emails:
          type: array
          items:
            type: string
            format: email

    GmailDealSummary:
      type: object
      properties:
        id:
          type: integer
        workspace_id:
          type: integer
        name:
          type: string
        stage:
          type: string
        pipeline:
          type: string
          nullable: true
        pipeline_id:
          type: integer
          nullable: true
        pipeline_stage_id:
          type: integer
          nullable: true
        company_id:
          type: integer
        company_name:
          type: string
          nullable: true
        value:
          type: number
        currency:
          type: string
        owner_name:
          type: string
          nullable: true
        contacts:
          type: array
          items:
            type: string
        contact_emails:
          type: array
          items:
            type: string
            format: email
          description: Primary emails of contacts already linked to the deal.
        expected_close_date:
          type: string
          format: date
          nullable: true
        next_task:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            title:
              type: string
            due_on:
              type: string
              format: date
              nullable: true
            completed:
              type: boolean
        tasks:
          type: array
          description: Up to 10 pending tasks, same order as next_task first.
          items:
            type: object
            properties:
              id:
                type: integer
              title:
                type: string
              due_on:
                type: string
                format: date
                nullable: true
              completed:
                type: boolean
        products:
          type: array
          items:
            type: string
        url:
          type: string
          format: uri
          nullable: true

    GmailThreadStatus:
      type: object
      properties:
        linked:
          type: array
          items:
            $ref: "#/components/schemas/GmailDealSummary"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/GmailDealSummary"
        suggested_companies:
          type: array
          description: Companies whose name or email domain resembles an external participant domain, such as ing.es.
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              domain:
                type: string
                nullable: true

    GmailThreadMessage:
      type: object
      properties:
        gmail_message_id:
          type: string
        rfc822_message_id:
          type: string
        from:
          type: string
        to:
          type: string
        cc:
          type: string
        subject:
          type: string
        body:
          type: string
        sent_at:
          type: string
          format: date-time

    GmailContactInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          description: Optional display name when creating a new person.

    GmailDealContactsRequest:
      type: object
      required: [contacts]
      properties:
        contacts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GmailContactInput"

    GmailThread:
      type: object
      required: [gmail_thread_id, messages]
      properties:
        gmail_thread_id:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/GmailThreadMessage"

    GmailThreadLinkRequest:
      type: object
      required: [thread]
      properties:
        deal_id:
          type: integer
          description: Link to an existing deal. Omit when creating a new deal.
        new_deal:
          type: object
          properties:
            name:
              type: string
            pipeline_stage_id:
              type: integer
            company_name:
              type: string
              description: Existing company name. A new company is created only when create_company is true.
            company_id:
              type: integer
              description: Attach this company. Takes precedence over company_name.
            create_company:
              type: boolean
              description: Confirm creation when company_name does not match an existing company. The external email domain is stored on the new company.
            contact_emails:
              type: array
              items:
                type: string
                format: email
              description: Additional thread participants or manually entered emails to link as deal contacts.
            contact_name:
              type: string
              description: Optional name for the manually entered email (see named_contact_email).
            named_contact_email:
              type: string
              format: email
              description: Email address that should receive contact_name when creating a new person.
        thread:
          $ref: "#/components/schemas/GmailThread"

    GmailThreadLinkResponse:
      type: object
      properties:
        deal:
          $ref: "#/components/schemas/GmailDealSummary"
        imported_count:
          type: integer
        messages:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              direction:
                type: string
                enum: [outbound, inbound]
              subject:
                type: string
              from:
                type: string
              to:
                type: string

paths:
  /api/v1/people:
    get:
      tags: [People]
      summary: List people
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/PersonEmailQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FeatureDisabled"
    post:
      tags: [People]
      summary: Create a person
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [person]
              properties:
                person:
                  $ref: "#/components/schemas/PersonInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FeatureDisabled"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/people/{id}:
    get:
      tags: [People]
      summary: Show a person
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [People]
      summary: Update a person
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [person]
              properties:
                person:
                  $ref: "#/components/schemas/PersonInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [People]
      summary: Delete a person
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PersonId"
      responses:
        "204":
          description: Deleted
        "401":
