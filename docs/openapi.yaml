      tags: [People]
      summary: Attach a file to a person
      description: >-
        Send a Base64 object as JSON (`attachment[filename]`, `attachment[content]`) or upload a file
        with `multipart/form-data` (`attachment[file]`). Requires the `attachments` feature.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attachment]
              properties:
                attachment:
                  $ref: "#/components/schemas/PersonAttachmentInput"
          multipart/form-data:
            schema:
              type: object
              required: [attachment]
              properties:
                attachment:
                  $ref: "#/components/schemas/PersonAttachmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonAttachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/marketing/mqls:
    post:
      tags: [Marketing]
      summary: Register an MQL
      description: |
        Finds or creates a person by email, moves them to the `mql` lifecycle stage (never demotes),
        subscribes them to the given subscription types (consent is given per type: at least one
        entry in `subscriptions`, each with its mandatory evidence) and optionally stores internal notes, timeline notes, attachments and a product interest, all in
        one transaction. Returns `201` when the person was created and `200` when an existing person
        was updated. Requires the `mql_pool` and `marketing_consent` features.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MqlCreateRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MqlCreateRequest"
      responses:
        "200":
          description: Existing person updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MqlCreation"
        "201":
          description: Person created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MqlCreation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/marketing/subscriptions:
    get:
      tags: [Marketing]
      summary: List subscriptions
      description: |
        Lists the subscriptions (consent per person and subscription type) of the workspace, most
        recently changed first, with the consent evidence and the person. Only people the caller can
        see are included. Requires the `marketing_consent` feature.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: subscription_type_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [subscribed, unsubscribed, pending]
        - name: person_id
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

