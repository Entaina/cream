  /api/v1/deals:
    get:
      tags: [Deals]
      summary: List deals
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FeatureDisabled"
    post:
      tags: [Deals]
      summary: Create a deal
      description: |
        A deal requires at least one next-action task with a due date today or later.
        Optional `notes` and an optional `email` (with Base64 or multipart file
        `attachments`) are created in the same transaction as the deal. Email delivery
        is queued after the transaction commits. Requires the `record_email` feature
        when `email` is present.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealCreateRequest"
            example:
              deal:
                name: Enterprise license
                company_id: 1
                contact_ids: [42]
                deal_products_attributes:
                  - product_id: 7
                    edition_name: "2026"
                    quantity: 2
                tasks_attributes:
                  - title: Send proposal
                    due_on: "2026-08-15"
              notes:
                - title: Discovery call
                  body: Interested in annual plan.
              email:
                to_address: lead@example.com
                subject: Welcome aboard
                body: "<p>Thanks for your interest.</p>"
                attachments:
                  - filename: brochure.pdf
                    content_type: application/pdf
                    content: JVBERi0xLjQK
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DealCreateMultipartRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FeatureDisabled"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/deals/{id}:
    get:
      tags: [Deals]
      summary: Show a deal
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DealId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Deals]
      summary: Update a deal
      description: Changing `pipeline_stage_id` routes through the stage machine (activities, webhooks, automations, stage triggers).
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DealId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deal]
              properties:
                deal:
                  $ref: "#/components/schemas/DealInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Deals]
      summary: Delete a deal
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DealId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/deals/{deal_id}/notes:
    post:
      tags: [Deal notes]
      summary: Add a note to a deal
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DealIdNested"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/deals/{deal_id}/emails:
    post:
      tags: [Deal emails]
      summary: Send an email from a deal
      description: |
        Queues delivery through the sender's Gmail account when connected and enabled;
        otherwise sends via SMTP. Attach files as Base64 in JSON or upload binary
        files with `multipart/form-data` (`email[attachments][]`). Requires the
        `record_email` feature.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DealIdNested"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  $ref: "#/components/schemas/DealEmailInput"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DealEmailMultipartRequest"
      responses:
        "201":
          description: Queued for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealEmail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/deals/{deal_id}/offers:
    post:
      tags: [Deal offers]
      summary: Upload a proposal to a deal
      description: |
        Uploads a proposal (offer) as a PDF/HTML file (Base64 in JSON, or `multipart/form-data`
        with `offer[file]`) or as pasted HTML (`html_body`) — exactly one of the two. If the deal
        already has the target offer, the content becomes its **next numbered version**; otherwise
        a new offer is created with version 1 (`offer_created: true`).

        Target offer: `offer_id`, else the offer whose `name` matches (case-insensitive), else —
        when neither is sent — the deal's only offer. If the deal has several offers and none is
        chosen the request fails with 422. A `name` that matches no offer creates a new one;
        when creating, the name defaults to the file name. Limit: 10 MB per file.
        Requires permission to edit the deal.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DealIdNested"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offer]
              properties:
                offer:
                  $ref: "#/components/schemas/DealOfferInput"
          multipart/form-data:
            schema:
              type: object
              required: [offer]
              properties:
                offer:
                  $ref: "#/components/schemas/DealOfferInput"
      responses:
        "201":
          description: Version created (and the offer, if it did not exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealOffer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

