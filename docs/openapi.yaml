  /api/v1/deals:
    get:
      tags: [Deals]
      summary: List deals
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FeatureDisabled"
    post:
      tags: [Deals]
      summary: Create a deal
      description: |
        A deal requires at least one next-action task with a due date today or later.
        Optional `notes` and an optional `email` (with Base64 or multipart file
        `attachments`) are created in the same transaction as the deal. Email delivery
        is queued after the transaction commits. Requires the `record_email` feature
        when `email` is present.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealCreateRequest"
            example:
              deal:
                name: Enterprise license
                company_id: 1
                contact_ids: [42]
                deal_products_attributes:
                  - product_id: 7
                    edition_name: "2026"
                    quantity: 2
                tasks_attributes:
                  - title: Send proposal
                    due_on: "2026-08-15"
              notes:
                - title: Discovery call
                  body: Interested in annual plan.
              email:
                to_address: lead@example.com
                subject: Welcome aboard
                body: "<p>Thanks for your interest.</p>"
                attachments:
                  - filename: brochure.pdf
                    content_type: application/pdf
                    content: JVBERi0xLjQK
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DealCreateMultipartRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FeatureDisabled"
        "422":
          $ref: "#/components/responses/ValidationError"

