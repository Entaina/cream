    errors:
      messages:
        access_denied: El propietario del recurso o el servidor de autorización denegó
          la petición.
        admin_authenticator_not_configured: El acceso al panel de administración está
          prohibido porque Doorkeeper.configure.admin_authenticator no está configurado.
        credential_flow_not_configured: El flujo Resource Owner Password Credentials
          falló porque Doorkeeper.configure.resource_owner_from_credentials no está
          configurado.
        forbidden_token:
          missing_scope: El acceso a este recurso requiere el scope "%{oauth_scopes}".
        invalid_client: La autenticación del cliente falló por cliente desconocido,
          falta de autenticación o método no soportado.
        invalid_code_challenge_method:
          one: El code_challenge_method debe ser %{challenge_methods}.
          other: El code_challenge_method debe ser uno de %{challenge_methods}.
          zero: El servidor de autorización no admite PKCE porque no hay valores aceptados
            de code_challenge_method.
        invalid_grant: La concesión de autorización no es válida, ha expirado, fue
          revocada, no coincide con la URI de redirección de la petición o se emitió
          para otro cliente.
        invalid_redirect_uri: La URI de redirección solicitada está mal formada o
          no coincide con la del cliente.
        invalid_request:
          invalid_code_challenge: Se requiere code challenge.
          missing_param: 'Falta el parámetro obligatorio: %{value}.'
          request_not_authorized: La petición debe autorizarse. Falta o es inválido
            el parámetro de autorización.
          unknown: La petición no incluye un parámetro obligatorio, incluye un valor
            no soportado o está mal formada.
        invalid_scope: El scope solicitado es inválido, desconocido o está mal formado.
        invalid_token:
          expired: El token de acceso expiró
          revoked: El token de acceso fue revocado
          unknown: El token de acceso no es válido
        resource_owner_authenticator_not_configured: No se pudo encontrar al propietario
          del recurso porque Doorkeeper.configure.resource_owner_authenticator no
          está configurado.
        revoke:
          unauthorized: No estás autorizado para revocar este token
        server_error: El servidor de autorización encontró una condición inesperada
          que impidió completar la petición.
        temporarily_unavailable: El servidor de autorización no puede atender la petición
          ahora mismo por sobrecarga temporal o mantenimiento.
        unauthorized_client: El cliente no está autorizado para realizar esta petición
          con este método.
        unsupported_grant_type: El servidor de autorización no admite este tipo de
          concesión.
        unsupported_response_mode: El servidor de autorización no admite este modo
          de respuesta.
        unsupported_response_type: El servidor de autorización no admite este tipo
          de respuesta.
