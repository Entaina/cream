---
en:
  activerecord:
    errors:
      messages:
        attachable_not_allowed: is not allowed
        attachment_count_exceeded: cannot exceed %{count} files
        attachment_file_too_large: "%{filename} exceeds %{megabytes} MB"
        attachment_total_too_large: total size cannot exceed %{megabytes} MB
        calendar_ids_required: select at least one calendar
        cannot_be_changed: cannot be changed
        cannot_be_host: cannot be the host
        cannot_be_same_person: cannot be the same person
        cannot_demote_last_admin: cannot demote the last admin
        cannot_remove_last_admin: cannot remove the last admin from the workspace
        commentable_not_allowed: is not allowed
        contain_invalid_values: 'contain invalid values: %{values}'
        custom_field_required: "%{name} is required"
        deal_converted_requires_attribute: is required when converted
        deal_required_for_capture: is required for deal capture destination
        ends_on_before_starts: must be on or after the start date
        event_types_required: configure at least one event type
        field_not_in_workspace: is not available in this workspace
        formula_required: is required for formula fields
        group_by_invalid: is not valid for %{record_type}
        guest_count_exceeded: allows at most %{count} guests
        guest_invalid_email: contains an invalid email
        invalid: is invalid
        invalid_json: must be valid JSON
        invalid_priority: contains an invalid priority
        invalid_service_account_json: must be a valid service account JSON with client_email
