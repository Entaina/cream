              needs_next_action: A deal needs a next action (a task with a due date
                today or later)
            execution_ends_on:
              must_be_on_or_after_start: must be on or after the execution start date
        lead_form:
          attributes:
            destination:
              requires_mql_features: requires MQL pool and marketing consent features
            hidden_field_keys:
              invalid_key: 'invalid key: %{key}'
              reserved_key: 'reserved key: %{key}'
            pipeline:
              required_for_deal_destination: is required for deal destination forms
            pipeline_routes:
              invalid_key: 'invalid key: %{key}'
              invalid_pipeline: invalid pipeline for %{help_type}
            slug:
              reserved: is reserved
        lead_form_template:
          attributes:
            slug:
              invalid_format: only lowercase letters, numbers, hyphens and underscores
