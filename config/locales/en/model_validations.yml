        invitation_pending: already has a pending invitation
        is_already_on_contact: is already on this contact
        item_must_include_text: each item must include text
        journey_required_for_delivery: must be present for journey delivery
        metric_deals_only: is only available for deals
        must_be_array_of_objects: must be an array of objects
        must_be_array_of_strings: must be an array of strings
        must_be_empty_for_team_briefings: must be empty for team briefings
        must_be_public_host: must be a public internet host
        must_be_workspace_member: must be a workspace member
        must_belong_to_deal_workspace: must belong to the deal workspace
        must_belong_to_same_product: must belong to the same product
        must_belong_to_same_workspace: must belong to the same workspace
        must_belong_to_selected_pipeline: must belong to the selected pipeline
        must_belong_to_workspace: must belong to the workspace
        must_differ_from_client_company: must be different from the client company
        offer_content_required: Attach a PDF, HTML, or ZIP file, or paste the offer HTML
        offer_file_type: must be a PDF, HTML, or ZIP file
        offer_zip_entry_not_found: does not contain an index.html or a single HTML file
        offer_zip_invalid: is not a valid ZIP file
        offer_zip_limits: exceeds the entry count or uncompressed size limit
        offer_single_source: Use either a file or pasted HTML, not both
        partner_must_differ_from_company: must be different from the client company
        pipeline_id_deals_only: is only valid for deals
        pipeline_id_invalid_workspace: is not valid for this workspace
        product_required_stop_open_deal: is required when stop on open deal is enabled
        record_reference_types_invalid: must be Person, Company, or Deal for record
          reference fields
        reference_syntax_error: 'syntax error: %{message}'
        relationship_exists_opposite: this relationship already exists in the opposite
          direction
        requires_mql_features: requires MQL pool and marketing consent features
        reserved_consent_field_key: is reserved
        select_options_required: must include at least one option for select fields
        single_primary_email: only one email can be primary
      models:
        deal:
          attributes:
