#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  purge_expired_client_portal_sessions:
    command: "ClientPortalSession.expired.delete_all"
    schedule: every day at 4:30am
  purge_expired_sessions:
    command: "Session.where(\"expires_at <= ?\", Time.current).in_batches.destroy_all"
    schedule: every day at 4:40am
  deliver_scheduled_reports:
    class: ScheduledReportsJob
    schedule: every day at 7am
  evaluate_alert_rules:
    class: AlertRulesJob
    schedule: every day at 7am
  run_journey_runner:
    class: JourneyRunnerJob
    schedule: every 10 minutes
  recalculate_lead_scores:
    class: ScoringRecalculateJob
    schedule: every day at 3am
  purge_marketing_events:
    class: MarketingDataRetentionJob
    schedule: every day at 4am
  sync_beehiiv_subscribers:
    class: BeehiivSyncSchedulerJob
    schedule: every hour
  sync_gmail_inboxes:
    class: GmailSyncSchedulerJob
    schedule: every 10 minutes
  sync_stripe_payments:
    class: StripeSyncSchedulerJob
    schedule: every 15 minutes
  sales_director_briefing:
    class: SalesDirectorBriefingJob
    schedule: every weekday at 2:30am
  database_backup:
    class: DatabaseBackupJob
    schedule: every day at 2am

development:
  sync_stripe_payments:
    class: StripeSyncSchedulerJob
    schedule: every 15 minutes
  run_journey_runner:
    class: JourneyRunnerJob
    schedule: every 10 minutes
  recalculate_lead_scores:
    class: ScoringRecalculateJob
    schedule: every day at 3am
  purge_marketing_events:
    class: MarketingDataRetentionJob
    schedule: every day at 4am
  sync_beehiiv_subscribers:
    class: BeehiivSyncSchedulerJob
    schedule: every hour

# Recurring tasks are loaded per environment. database_backup is production-only.
