default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Inbox sync is slow. Its own worker keeps mail and other jobs off those threads.
    # Recurring command tasks (SolidQueue::RecurringJob) use solid_queue_recurring.
    - queues: [default, solid_queue_recurring]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    - queues: gmail_sync
      threads: 3
      processes: 1
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
