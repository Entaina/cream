# i18n-tasks finds and manages missing and unused translations: https://github.com/glebm/i18n-tasks

base_locale: en
locales: [en, es]

data:
  read:
    - config/locales/%{locale}/**/*.yml
  write:
    - ["records.*", "config/locales/%{locale}/records.yml"]
    - ["booking.*", "config/locales/%{locale}/booking.yml"]
    - ["doorkeeper.*", "config/locales/%{locale}/doorkeeper.yml"]
    - config/locales/%{locale}/application.yml
